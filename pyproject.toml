[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "porous-fvm"
version = "0.1.0"
description = "Двумерная двухфазная фильтрация методом конечных объёмов"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = ["numpy>=1.26", "scipy>=1.12", "pyamg>=5.3", "XlsxWriter>=3.2"]

[project.optional-dependencies]
yaml = ["PyYAML>=6.0"]
hdf5 = ["h5py>=3.10"]
dev = ["pytest>=8.0"]
distribution = ["PyInstaller>=6.16,<7"]
jit = ["numba>=0.61"]

[project.scripts]
porous-fvm = "porous_fvm.cli:main"
porous-fvm-gui = "porous_fvm.gui:main"

[tool.setuptools.packages.find]
where = ["src"]
